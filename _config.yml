title: Indivar Mishra
description: Indivar Mishra’s projects, publications, and notes on Python, AI, and open source.
url: "https://indivar.xyz"
baseurl: "" # Use /repository-name for a project without a custom domain.
timezone: Asia/Kolkata
lang: en
author: Indivar Mishra
permalink: /blog/:title/
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
plugins:
  - jekyll-feed
  - jekyll-sitemap
defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      section: writing
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - docs
  - test_site.rb
  - vendor
  - posts
