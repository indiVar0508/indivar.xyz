[package]
name = "p60"
version = "0.1.0"
edition = "2021"
description = "The BMW P60B40's timing and kinematics, and a synthesized engine sound, for the garage (wasm32)."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
